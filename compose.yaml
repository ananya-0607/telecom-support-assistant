# Host bind mounts preserve knowledge, taxonomy and logs across container recreation.
services:
  api:
    build:
      context: .
      target: api
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in your local .env}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      SEMANTIC_THRESHOLD: ${SEMANTIC_THRESHOLD:-0.30}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
    stop_grace_period: 15m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 10
  ui:
    build:
      context: .
      target: ui
    environment:
      SUPPORT_API_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
